name: Nightly offline build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: choice
        options:
          - Release
          - Debug
        default: Release
      linux_x64:
        description: Linux x86-64
        type: boolean
        default: true
      linux_arm64:
        description: Linux ARM64
        type: boolean
        default: true
      windows_mingw_x64:
        description: Windows x86-64 (MinGW)
        type: boolean
        default: true
      windows_msvc_x64:
        description: Windows x86-64 (MSVC)
        type: boolean
        default: true
      windows_msvc_arm64:
        description: Windows ARM64 (MSVC)
        type: boolean
        default: true
      macos_universal:
        description: macOS universal
        type: boolean
        default: true

permissions: {}

jobs:
  select-platforms:
    name: Select build platforms
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Generate matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          LINUX_X64: ${{ inputs.linux_x64 }}
          LINUX_ARM64: ${{ inputs.linux_arm64 }}
          WINDOWS_MINGW_X64: ${{ inputs.windows_mingw_x64 }}
          WINDOWS_MSVC_X64: ${{ inputs.windows_msvc_x64 }}
          WINDOWS_MSVC_ARM64: ${{ inputs.windows_msvc_arm64 }}
          MACOS_UNIVERSAL: ${{ inputs.macos_universal }}
        run: |
          entries='[]'

          selected() {
            [[ "$EVENT_NAME" == 'schedule' || "$1" == 'true' ]]
          }

          if selected "$LINUX_X64"; then
            entries=$(jq -c '. + [{"os":"ubuntu-24.04","artifact-name":"Linux","cmake-preset":"linux","msystem":"","vcvars-arch":"","macosx-deployment-target":"","qt-version":"6.11.2"}]' <<< "$entries")
          fi
          if selected "$LINUX_ARM64"; then
            entries=$(jq -c '. + [{"os":"ubuntu-24.04-arm","artifact-name":"Linux-aarch64","cmake-preset":"linux","msystem":"","vcvars-arch":"","macosx-deployment-target":"","qt-version":"6.11.2"}]' <<< "$entries")
          fi
          if selected "$WINDOWS_MINGW_X64"; then
            entries=$(jq -c '. + [{"os":"windows-2022","artifact-name":"Windows-MinGW-w64","cmake-preset":"windows_mingw","msystem":"CLANG64","vcvars-arch":"amd64_x86","macosx-deployment-target":"","qt-version":"6.11.2"}]' <<< "$entries")
          fi
          if selected "$WINDOWS_MSVC_X64"; then
            entries=$(jq -c '. + [{"os":"windows-2022","artifact-name":"Windows-MSVC","cmake-preset":"windows_msvc","msystem":"","vcvars-arch":"amd64","macosx-deployment-target":"","qt-version":"6.11.2"}]' <<< "$entries")
          fi
          if selected "$WINDOWS_MSVC_ARM64"; then
            entries=$(jq -c '. + [{"os":"windows-11-arm","artifact-name":"Windows-MSVC-arm64","cmake-preset":"windows_msvc","msystem":"","vcvars-arch":"arm64","macosx-deployment-target":"","qt-version":"6.11.2"}]' <<< "$entries")
          fi
          if selected "$MACOS_UNIVERSAL"; then
            entries=$(jq -c '. + [{"os":"macos-26","artifact-name":"macOS","cmake-preset":"macos_universal","msystem":"","vcvars-arch":"","macosx-deployment-target":"13.0","qt-version":"6.11.2"}]' <<< "$entries")
          fi

          if [[ "$entries" == '[]' ]]; then
            echo '::error::Select at least one build platform.'
            exit 1
          fi

          matrix=$(jq -cn --argjson include "$entries" '{include:$include}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.artifact-name }})
    needs: select-platforms

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: offline-nightly
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      - name: Checkout upstream Prism Launcher
        uses: actions/checkout@v7
        with:
          repository: PrismLauncher/PrismLauncher
          ref: develop
          submodules: true

      - name: Checkout workflow and patch
        uses: actions/checkout@v7
        with:
          path: patches

      - name: Apply source and CI patches
        shell: bash
        run: |
          git apply patches/.github/patches/offline-mode.patch
          git apply patches/.github/patches/qt-py7zr-workaround.patch

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      - name: Configure project
        run: cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"

      - name: Run build
        run: cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        env:
          MSYS2_PATH_TYPE: inherit
        run: ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      - name: Get upstream version
        id: short-version
        shell: bash
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        env:
          CI_HAS_ACCESS_TO_AZURE: ${{ vars.CI_HAS_ACCESS_TO_AZURE || '' }}
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
